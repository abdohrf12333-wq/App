<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <meta http-equiv='Cache-Control' content='no-cache, no-store, must-revalidate'>
    <meta http-equiv='Pragma' content='no-cache'>
    <meta http-equiv='Expires' content='0'>
    <title>الموقع الرسمي</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        .btn {
            display: inline-block;
            padding: 15px 35px;
            font-size: 18px;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        .sub-text {
            color: #6c757d;
            font-size: 13px;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-box {
            background: #FDEDEC;
            border: 1px solid #E74C3C;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            display: none;
        }
        .error-box.show { display: block; }
        .retry-btn {
            background: #F39C12;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .retry-btn:hover { background: #E67E22; }
    </style>
</head>
<body>
    <div class='container'>
        <h2 style='color: #2C3E50;'>🚀 جاري التحويل...</h2>
        <p style='color: #7F8C8D;'>سيتم تحويلك إلى الموقع الرسمي خلال ثوانٍ</p>
        <div class='spinner' id='spinner'></div>
        <p style='color: #95A5A6; font-size: 14px;' id='statusText'>⏳ جاري الاتصال بالسيرفر...</p>
        <div class='error-box' id='errorBox'>
            <h3 style='color: #E74C3C;'>⚠️ فشل الاتصال</h3>
            <p id='errorDetail' style='color: #7F8C8D;'>السيرفر غير متصل حالياً</p>
            <button class='retry-btn' id='retryBtn'>🔄 إعادة المحاولة</button>
        </div>
        <a href='https://approx-note-steering-charge.trycloudflare.com' class='btn' id='manualLink'>🔗 الذهاب للموقع يدوياً</a>
        <p class='sub-text'>📅 آخر تحديث: 2026/07/10 07:01:03</p>
    </div>
    <script>
        const TARGET_URL = 'https://approx-note-steering-charge.trycloudflare.com';
        let redirectAttempted = false;
        let retryCount = 0;
        const MAX_RETRIES = 5;
        let checkInterval = null;

        function isValidUrl(url) {
            try { return url && url.startsWith('https://') && url.includes('trycloudflare.com'); } catch { return false; }
        }

        function checkServer() {
            if (redirectAttempted) return;
            if (!isValidUrl(TARGET_URL)) { showError('الرابط غير صحيح'); return; }
            document.getElementById('statusText').innerHTML = '⏳ جاري فحص السيرفر...';
            fetch(TARGET_URL, { method: 'HEAD', mode: 'no-cors', cache: 'no-cache' })
                .then(function() { onServerConnected(); })
                .catch(function() { onServerFailed(); });
        }

        function onServerConnected() {
            if (redirectAttempted) return;
            document.getElementById('errorBox').classList.remove('show');
            document.getElementById('statusText').innerHTML = '✅ السيرفر يعمل! جاري التحويل...';
            document.getElementById('statusText').style.color = '#27AE60';
            clearInterval(checkInterval);
            setTimeout(function() { redirectAttempted = true; window.location.replace(TARGET_URL); }, 800);
        }

        function onServerFailed() {
            retryCount++;
            if (retryCount >= MAX_RETRIES) { showError('فشل الاتصال بعد عدة محاولات.'); return; }
            document.getElementById('errorBox').classList.add('show');
            document.getElementById('errorDetail').textContent = 'محاولة ' + retryCount + '/' + MAX_RETRIES;
            document.getElementById('statusText').innerHTML = '<span style="color: #E74C3C;">❌ فشل الاتصال... (' + retryCount + '/' + MAX_RETRIES + ')</span>';
        }

        function showError(message) {
            document.getElementById('errorBox').classList.add('show');
            document.getElementById('errorDetail').textContent = message;
            document.getElementById('statusText').innerHTML = '<span style="color: #E74C3C;">❌ فشل الاتصال</span>';
            document.getElementById('spinner').style.display = 'none';
            clearInterval(checkInterval);
        }

        function startChecking() {
            checkServer();
            checkInterval = setInterval(checkServer, 4000);
        }

        function retry() {
            retryCount = 0;
            document.getElementById('errorBox').classList.remove('show');
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('statusText').innerHTML = '⏳ جاري إعادة المحاولة...';
            clearInterval(checkInterval);
            redirectAttempted = false;
            setTimeout(function() { startChecking(); }, 500);
        }

        document.getElementById('manualLink').addEventListener('click', function(e) {
            e.preventDefault();
            if (isValidUrl(TARGET_URL)) { window.location.replace(TARGET_URL); }
            else { showError('الرابط غير صحيح!'); }
        });

        document.getElementById('retryBtn').addEventListener('click', retry);

        if (isValidUrl(TARGET_URL)) { startChecking(); }
        else { showError('الرابط غير صحيح أو منتهي الصلاحية.'); }
    </script>
</body>
</html>
