<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <title>جاري التحويل...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            direction: rtl;
        }
        .container { text-align: center; padding: 40px; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .link {
            color: #FFD700;
            text-decoration: underline;
            cursor: pointer;
        }
        .error {
            color: #FF6B6B;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class='container'>
        <h1>🔄 جاري التحويل...</h1>
        <div class='spinner'></div>
        <p>سيتم تحويلك إلى الرابط الجديد خلال ثوانٍ</p>
        <p>
            <a href='https://logs-timothy-groove-mating.trycloudflare.com' class='link' id='manualLink'>
                اضغط هنا إذا لم يتم التحويل
            </a>
        </p>
        <p class='error' id='errorMsg'></p>
        <p style='font-size: 12px; opacity: 0.7; margin-top: 20px;'>
            تم التحديث: 2026/07/10 06:17:48
        </p>
    </div>
    <script>
        // محاولة التحويل مع إعادة المحاولة
        let attempts = 0;
        const maxAttempts = 5;
        const targetUrl = 'https://logs-timothy-groove-mating.trycloudflare.com';

        function redirect() {
            try {
                window.location.replace(targetUrl);
            } catch (e) {
                document.getElementById('errorMsg').textContent = '⚠️ خطأ في التحويل: ' + e.message;
            }
        }

        // محاولة فورية
        setTimeout(redirect, 2000);

        // محاولات إضافية في حالة الفشل
        const retryInterval = setInterval(function() {
            attempts++;
            if (attempts >= maxAttempts) {
                clearInterval(retryInterval);
                document.getElementById('errorMsg').textContent = 
                    '⚠️ لم يتم التحويل تلقائياً. اضغط على الرابط أعلاه.';
                return;
            }
            redirect();
        }, 3000);

        // التحويل عند الضغط على الرابط
        document.getElementById('manualLink').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.replace(targetUrl);
        });
    </script>
</body>
</html>
